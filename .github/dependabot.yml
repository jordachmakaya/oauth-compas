# Low-noise policy: one monthly pass, updates grouped into a single PR per
# ecosystem, major versions handled by hand. Security updates are grouped too,
# and are not delayed by the schedule or the cooldown.
version: 2
updates:
  - package-ecosystem: npm # also covers pnpm-lock.yaml and the pnpm catalog
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        applies-to: version-updates
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
