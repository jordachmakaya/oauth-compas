name: Provider check
on:
  schedule:
    - cron: '0 8 1 * *' # monthly automated check
    - cron: '0 9 1 1,7 *' # manual review reminder, every 6 months
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Open a test issue to prove the alert works
        type: boolean
        default: false
permissions:
  contents: read
env:
  TURBO_TELEMETRY_DISABLED: 1
jobs:
  check:
    if: github.event.schedule != '0 9 1 1,7 *'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - id: check
        run: node dist/scripts/check-providers.js
        env:
          REPORT_PATH: provider-report.md
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
      - name: Open or update the issue
        if: steps.check.outputs.broken == 'true' || failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -f provider-report.md ] || printf 'The provider check could not run. See %s\n' "$RUN_URL" > provider-report.md
          gh label create provider-drift --color D93F0B --description "A provider no longer matches our documentation" --force
          existing=$(gh issue list --label provider-drift --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file provider-report.md
          else
            gh issue create --title "Provider check: review needed" --label provider-drift --body-file provider-report.md
          fi
  reminder:
    if: github.event.schedule == '0 9 1 1,7 *'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create provider-review --color 0E8A16 --description "Scheduled manual review of provider consoles" --force
          existing=$(gh issue list --label provider-review --state open --limit 1 --json number --jq '.[0].number // empty')
          [ -n "$existing" ] && exit 0
          gh issue create --title "Manual provider review" --label provider-review --body "Automated checks cannot see provider consoles. Follow each guide with a disposable app and fix any step that changed.

          - [ ] docs/google.md
          - [ ] docs/github.md
          - [ ] docs/linkedin.md
          - [ ] docs/cognito.md"
